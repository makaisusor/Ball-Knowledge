<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ball Knowledge — MLB</title><style>
:root{color-scheme:dark;--bg:#080d18;--panel:#121c2d;--line:#28374d;--text:#f4f7fc;--muted:#99abc5;--accent:#67f1ad;--danger:#ff7187}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#203958 0%,#080d18 55%);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}main{max-width:750px;margin:auto;padding:24px 17px 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:24px;margin:0;letter-spacing:-1px}.brand{color:var(--accent)}h2{font-size:25px;margin:0 0 9px}p{color:var(--muted);line-height:1.5}.tag{border:1px solid #3b6256;color:var(--accent);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}.panel{background:rgba(18,28,45,.94);border:1px solid var(--line);border-radius:19px;padding:22px;margin-bottom:17px;box-shadow:0 12px 40px #0002}.hidden{display:none!important}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:19px 0}.mode{background:#1a2a3d;border:1px solid #34455b;border-radius:13px;padding:15px 6px;text-align:center;font-size:13px;cursor:pointer;color:var(--text)}.mode.active{border-color:var(--accent);background:#183c38;color:var(--accent)}label{display:block;font-weight:700;font-size:13px;margin:16px 0 8px}input,select{width:100%;padding:14px 13px;background:#0a1422;border:1px solid #41516a;border-radius:11px;color:var(--text);font-size:16px;outline:none}input:focus,select:focus{border-color:var(--accent)}button{font:inherit;cursor:pointer}button.primary{background:var(--accent);border:0;border-radius:11px;color:#062019;font-weight:800;padding:14px 20px;width:100%}button.secondary{background:#243247;border:1px solid #41516a;border-radius:10px;color:white;padding:10px 13px}.actions{display:flex;gap:9px;margin-top:14px}.actions>*{flex:1}.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.stat{background:#0b1524;border:1px solid var(--line);border-radius:13px;padding:15px;text-align:center;flex:1}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}.stats{display:flex;gap:10px;margin:17px 0}.timer{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent)}.timer.urgent{color:var(--danger)}.letter{font-size:64px;color:var(--accent);font-weight:900;line-height:1.1}.center{text-align:center}.suggest{position:relative}.suggestions{position:absolute;z-index:5;top:100%;left:0;right:0;background:#17263a;border:1px solid #526680;border-radius:12px;max-height:235px;overflow:auto;box-shadow:0 15px 30px #0008}.suggestions button{display:block;width:100%;text-align:left;padding:13px;background:transparent;color:white;border:0;border-bottom:1px solid #2d4055}.suggestions button:active{background:#315066}.notice{padding:12px;border-radius:10px;background:#243247;color:#e3edfb;font-size:14px;margin:10px 0}.notice.bad{background:#502631;color:#ffe3e8}.history{list-style:none;padding:0;margin:12px 0;max-height:360px;overflow:auto}.history li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.history small{color:var(--muted)}.pill{border-radius:99px;background:#263b4b;padding:5px 9px;font-size:12px}.players{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.playerchip{padding:8px 10px;border-radius:9px;background:#263549;font-size:13px}.playerchip.out{opacity:.42;text-decoration:line-through}.footer{font-size:12px;color:var(--muted);margin-top:28px}#app{min-height:250px}@media(max-width:430px){.panel{padding:17px}.modes{gap:5px}.mode{padding:14px 3px;font-size:12px}}
